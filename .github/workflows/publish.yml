name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      target:
        description: "Where to publish"
        required: true
        default: "both"
        type: choice
        options:
          - both
          - vscode
          - openvsx

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Compile
        run: bun x tsc -p ./

      - name: Read package version
        id: pkg
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          PKG_VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$tag_version" != "$PKG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Package extension
        env:
          PKG_VERSION: ${{ steps.pkg.outputs.version }}
        run: bun x @vscode/vsce package --out "version-check-$PKG_VERSION.vsix"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: version-check-${{ steps.pkg.outputs.version }}
          path: version-check-${{ steps.pkg.outputs.version }}.vsix
          if-no-files-found: error

      - name: Publish to VS Code Marketplace
        if: ${{ github.event_name == 'push' || inputs.target == 'both' || inputs.target == 'vscode' }}
        continue-on-error: true
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          PKG_VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::warning::VSCE_PAT secret not set; skipping VS Code Marketplace"
            exit 0
          fi
          bun x @vscode/vsce publish --packagePath "version-check-$PKG_VERSION.vsix" --pat "$VSCE_PAT"
      - name: Publish to Open VSX
        if: ${{ github.event_name == 'push' || inputs.target == 'both' || inputs.target == 'openvsx' }}
        continue-on-error: true
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
          PKG_VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "::warning::OVSX_PAT secret not set; skipping Open VSX"
            exit 0
          fi
          bun x ovsx publish "version-check-$PKG_VERSION.vsix" -p "$OVSX_PAT"
